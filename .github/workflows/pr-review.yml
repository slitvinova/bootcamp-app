name: PR QA Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  qa-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: |
            Use the /qa-review skill to review the changes introduced by this pull request.
            Run `git diff origin/${{ github.base_ref }}...HEAD` to see what changed.
            Group findings by severity (Critical → Major → Minor → Trivial) per the skill format.
            If no issues found, say so explicitly.

            Write your complete review text to /tmp/qa-review.md — review content only, no extra commentary.

      - name: Post review comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/qa-review.md ]; then
            gh pr comment ${{ github.event.pull_request.number }} \
              --repo ${{ github.repository }} \
              --body-file /tmp/qa-review.md
          fi
