name: PR QA Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  qa-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: |
            Use the /qa-review skill to review the changes introduced by this pull request.
            Run `git diff origin/${{ github.base_ref }}...HEAD` to see what changed.
            Group findings by severity (Critical → Major → Minor → Trivial) per the skill format.
            If no issues found, say so explicitly.

            When your review is complete, post it as a PR comment using the
            mcp__github__add_issue_comment tool with:
              owner: ${{ github.repository_owner }}
              repo: ${{ github.event.repository.name }}
              issue_number: ${{ github.event.pull_request.number }}
